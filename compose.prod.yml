services:
  kafka:
    environment:
      KAFKA_HEAP_OPTS: -Xms256m -Xmx768m

  core-service:
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx768m -XX:+UseG1GC
      CORE_ALLOWED_ORIGINS: https://roomix-demo.3-24-130-150.sslip.io
      PASSWORD_RESET_URL: https://roomix-demo.3-24-130-150.sslip.io/reset-password
      REFRESH_TOKEN_COOKIE_SECURE: "true"
    healthcheck:
      start_period: 5m

  rental-service:
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx768m -XX:+UseG1GC
      SPRING_PROFILES_ACTIVE: prod
    healthcheck:
      start_period: 5m

  api-gateway:
    environment:
      JAVA_TOOL_OPTIONS: -Xms96m -Xmx512m -XX:+UseG1GC
      GATEWAY_ALLOWED_ORIGINS: https://roomix-demo.3-24-130-150.sslip.io

  frontend:
    build:
      context: ../Roomix
      dockerfile: Dockerfile
      args:
        API_URL: http://api-gateway:8080
    environment:
      API_URL: http://api-gateway:8080
    depends_on:
      api-gateway:
        condition: service_started
    restart: unless-stopped

  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_started
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:

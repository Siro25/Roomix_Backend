# Application
spring.application.name=core-service
server.port=${CORE_PORT:8081}

# PostgreSQL
spring.datasource.url=${CORE_DB_URL:jdbc:postgresql://localhost:5432/core_db}
spring.datasource.username=${CORE_DB_USERNAME:postgres}
spring.datasource.password=${CORE_DB_PASSWORD:123456}

# Persistence
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT - JWT_SECRET must contain at least 32 random bytes encoded as Base64.
security.jwt.secret=${JWT_SECRET:evER6JVneQFjLRG5ElZ97OsQyrfO43uDQBoztSmwdyI=}
security.jwt.issuer=${JWT_ISSUER:roomix-core}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

# Cloudinary - configure these variables outside source control.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:roomix/rooms}

# Multipart upload limits
spring.servlet.multipart.max-file-size=${MAX_IMAGE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:50MB}

# OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Rental events; manual ack only after the Core database transaction commits.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=core-room-projection
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.concurrency=3
spring.kafka.listener.missing-topics-fatal=false

spring.application.name=core-service
server.port=${CORE_PORT:8081}
spring.datasource.url=${CORE_DB_URL}
spring.datasource.username=${CORE_DB_USERNAME}
spring.datasource.password=${CORE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# Chỉ bật always cho database mới sau khi kiểm tra schema; không sửa bảng có sẵn.
spring.sql.init.mode=${CORE_DB_INIT_MODE:never}
spring.sql.init.schema-locations=classpath:schema.sql,classpath:face-sessions.sql,classpath:telegram-outbox.sql
core.auth.jwt-secret=${JWT_SECRET}
core.auth.jwt-issuer=${CORE_JWT_ISSUER:roomix-core}
core.auth.jwt-ttl-seconds=${CORE_JWT_TTL_SECONDS:900}
core.auth.bootstrap.enabled=${CORE_BOOTSTRAP_ADMIN:false}
core.auth.allowed-origins=${CORE_ALLOWED_ORIGINS:}
core.face.service-token=${FACE_SERVICE_TOKEN}
core.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
core.telegram.chat-id=${TELEGRAM_CHAT_ID:}
core.telegram.worker-enabled=${CORE_TELEGRAM_WORKER_ENABLED:true}
spring.task.scheduling.shutdown.await-termination=true
spring.task.scheduling.shutdown.await-termination-period=15s
server.error.include-message=never
server.error.include-stacktrace=never

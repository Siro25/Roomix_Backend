# Application
spring.application.name=core-service
server.port=${CORE_PORT:8081}

# PostgreSQL
spring.datasource.url=${CORE_DB_URL:jdbc:postgresql://localhost:5432/core_db}
spring.datasource.username=${CORE_DB_USERNAME:postgres}
spring.datasource.password=${CORE_DB_PASSWORD:123456}

# Persistence
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# JWT - JWT_SECRET must contain at least 32 random bytes encoded as Base64.
security.jwt.secret=${JWT_SECRET:evER6JVneQFjLRG5ElZ97OsQyrfO43uDQBoztSmwdyI=}
security.jwt.issuer=${JWT_ISSUER:roomix-core}
security.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}

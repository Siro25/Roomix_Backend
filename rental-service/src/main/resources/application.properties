spring.application.name=rental-service
server.port=${RENTAL_PORT:8082}
spring.datasource.url=${RENTAL_DB_URL:jdbc:postgresql://localhost:5432/rental_db}
spring.datasource.username=${RENTAL_DB_USERNAME:postgres}
spring.datasource.password=${RENTAL_DB_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=${JWT_ISSUER:roomix-core}
core-service.url=${CORE_SERVICE_URL:http://localhost:8081}
core-service.connect-timeout=${CORE_CONNECT_TIMEOUT:3s}
core-service.read-timeout=${CORE_READ_TIMEOUT:5s}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Kafka transactional outbox. Use the same broker address in Core Service.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.max.block.ms=5000
roomix.outbox.poll-delay-ms=${OUTBOX_POLL_DELAY_MS:500}

# Sandbox credentials must come from the merchant account; never commit the secret.
vnpay.payment-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.return-url=${VNPAY_RETURN_URL:}
